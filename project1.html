<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kalkulator - Fauzi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eff6ff
                );
        }

        .calculator {
            width: 330px;

            padding: 25px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.15);
        }

        .calculator h1 {
            margin-top: 0;

            text-align: center;

            color: #0f172a;

            font-size: 25px;
        }

        #display {
            width: 100%;

            height: 65px;

            margin-bottom: 20px;

            padding: 10px 15px;

            border: none;

            border-radius: 10px;

            background: #f1f5f9;

            color: #0f172a;

            text-align: right;

            font-size: 28px;

            font-weight: bold;
        }

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 60px;

            border: none;

            border-radius: 12px;

            background: #e2e8f0;

            color: #0f172a;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            background: #cbd5e1;
        }

        .operator {
            background: #38bdf8;

            color: white;
        }

        .operator:hover {
            background: #0ea5e9;
        }

        .clear {
            background: #ef4444;

            color: white;
        }

        .clear:hover {
            background: #dc2626;
        }

        .equal {
            background: #2563eb;

            color: white;
        }

        .equal:hover {
            background: #1d4ed8;
        }

        .back {
            margin-top: 20px;

            width: 100%;

            height: 45px;

            background: #0f172a;

            color: white;

            font-size: 15px;
        }

        .back:hover {
            background: #1e293b;
        }

    </style>

</head>

<body>

    <div class="calculator">

        <h1>Kalkulator Fauzi</h1>

        <input
            type="text"
            id="display"
            value="0"
            readonly
        >

        <div class="buttons">

            <button
                class="clear"
                onclick="clearDisplay()"
            >
                C
            </button>

            <button onclick="deleteNumber()">
                ←
            </button>

            <button
                class="operator"
                onclick="addOperator('%')"
            >
                %
            </button>

            <button
                class="operator"
                onclick="addOperator('/')"
            >
                ÷
            </button>


            <button onclick="addNumber('7')">
                7
            </button>

            <button onclick="addNumber('8')">
                8
            </button>

            <button onclick="addNumber('9')">
                9
            </button>

            <button
                class="operator"
                onclick="addOperator('*')"
            >
                ×
            </button>


            <button onclick="addNumber('4')">
                4
            </button>

            <button onclick="addNumber('5')">
                5
            </button>

            <button onclick="addNumber('6')">
                6
            </button>

            <button
                class="operator"
                onclick="addOperator('-')"
            >
                −
            </button>


            <button onclick="addNumber('1')">
                1
            </button>

            <button onclick="addNumber('2')">
                2
            </button>

            <button onclick="addNumber('3')">
                3
            </button>

            <button
                class="operator"
                onclick="addOperator('+')"
            >
                +
            </button>


            <button onclick="addNumber('0')">
                0
            </button>

            <button onclick="addNumber('.')">
                .
            </button>

            <button
                class="equal"
                onclick="calculate()"
                style="grid-column: span 2;"
            >
                =
            </button>

        </div>

        <button
            class="back"
            onclick="window.location.href='index.html'"
        >
            ← Kembali ke Portfolio
        </button>

    </div>


    <script>

        const display =
            document.getElementById("display");


        function addNumber(number) {

            if (display.value === "0") {

                display.value = number;

            } else {

                display.value += number;

            }
        }


        function addOperator(operator) {

            const lastCharacter =
                display.value.slice(-1);

            if (
                ["+", "-", "*", "/", "%"]
                .includes(lastCharacter)
            ) {
                return;
            }

            display.value += operator;
        }


        function clearDisplay() {

            display.value = "0";
        }


        function deleteNumber() {

            if (display.value.length <= 1) {

                display.value = "0";

            } else {

                display.value =
                    display.value.slice(0, -1);
            }
        }


        function calculate() {

            try {

                const result =
                    Function(
                        "return " +
                        display.value
                    )();

                display.value = result;

            } catch {

                display.value = "Error";

                setTimeout(() => {

                    display.value = "0";

                }, 1000);
            }
        }

    </script>

</body>

</html>
